<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOEZ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Inter',sans-serif}
a{color:inherit;text-decoration:none}
.top{position:fixed;top:0;width:100%;height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;background:#000;border-bottom:1px solid #111;z-index:10}
.logo{font-size:15px;letter-spacing:0.4em}
.menu{font-size:10px;letter-spacing:0.25em;opacity:0.6;display:flex;gap:24px;align-items:center}
.btn-sm{border:1px solid #fff;padding:8px 18px;border-radius:999px;font-size:10px;letter-spacing:0.2em;transition:0.3s}
.btn-sm:hover{background:#fff;color:#000}
.hero{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:100px 24px 60px}
.hero h1{font-size:clamp(72px,14vw,140px);font-weight:400;letter-spacing:-0.06em;line-height:0.85;margin-bottom:16px}
.hero .sub{font-size:12px;opacity:0.35;letter-spacing:0.3em;margin-bottom:36px}
.btn-big{display:inline-block;border:1px solid #fff;background:#fff;color:#000;padding:16px 48px;font-size:11px;letter-spacing:0.25em;transition:0.3s}
.btn-big:hover{background:transparent;color:#fff}
.ca-wrap{margin-top:48px;border:1px solid #111;padding:14px 18px;display:flex;gap:12px;align-items:center;max-width:520px;width:100%;background:#050505}
.ca-wrap span{font-size:9px;opacity:0.3;letter-spacing:0.2em;white-space:nowrap}
.ca-wrap code{font-size:11px;opacity:0.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.copy{font-size:10px;border:1px solid #222;padding:6px 10px;cursor:pointer;transition:0.2s}
.copy:hover{border-color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:600px;margin-top:56px;border-top:1px solid #111;border-bottom:1px solid #111}
.s{padding:22px;text-align:center;border-right:1px solid #111}
.s:last-child{border:none}
.s b{display:block;font-size:18px;font-weight:400;margin-bottom:4px}
.s i{font-style:normal;font-size:9px;opacity:0.3;letter-spacing:0.2em}
.foot{padding:32px;text-align:center;font-size:9px;opacity:0.15;letter-spacing:0.3em;border-top:1px solid #111}
</style>
</head>
<body>
<div class="top">
  <div class="logo">VOEZ</div>
  <div class="menu">
    <a href="https://x.com/voezorg" target="_blank">X</a>
    <a href="https://app.torchpad.fun/trade/robinhood/0xca34a9fb0475b443ea799aa0dbaae2008d571111" target="_blank" class="btn-sm">TRADE</a>
  </div>
</div>

<div class="hero">
  <h1>VOEZ</h1>
  <div class="sub">1B SUPPLY • 0/0 TAX • LP BURNED</div>
  
  <a class="btn-big" href="https://app.torchpad.fun/trade/robinhood/0xca34a9fb0475b443ea799aa0dbaae2008d571111" target="_blank">BUY $VOEZ</a>

  <div class="ca-wrap" onclick="copyCA()">
    <span>CA</span>
    <code id="ca">0x50ba557d1fdc846f48da5ae2b5d51a8ee05aa245</code>
    <div class="copy" id="cp">COPY</div>
  </div>

  <div class="stats">
    <div class="s"><b>1B</b><i>SUPPLY</i></div>
    <div class="s"><b>0/0</b><i>TAX</i></div>
    <div class="s"><b>BURNED</b><i>LP</i></div>
  </div>
</div>

<div class="foot">VOEZ © 2026</div>

<script>
function copyCA(){
  const ca=document.getElementById('ca').innerText;
  navigator.clipboard.writeText(ca);
  document.getElementById('cp').innerText='COPIED';
  setTimeout(()=>document.getElementById('cp').innerText='COPY',1500);
}
</script>
</body>
</html>
