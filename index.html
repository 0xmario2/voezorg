<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOEZ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Inter',sans-serif;letter-spacing:-0.01em}
::selection{background:#fff;color:#000}
/* TOP BAR - CLEAN */
.top{position:fixed;top:0;width:100%;height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;z-index:10;background:#000;border-bottom:1px solid #111}
.logo{font-size:15px;letter-spacing:0.4em;font-weight:300}
.menu{font-size:10px;letter-spacing:0.25em;opacity:0.4;display:flex;gap:24px}
/* HERO - ONLY DOOR */
.hero{height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:56px}
.door{width:300px;height:400px;border:1px solid #fff;position:relative;overflow:hidden;cursor:pointer;transition:0.6s}
.door:hover{box-shadow:0 0 60px rgba(255,255,255,0.12)}
.field{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1501854140801-50d01698950b?q=80&w=800') center/cover;opacity:0;transition:0.9s}
.door:hover .field{opacity:1}
.panel{position:absolute;right:0;top:0;width:50%;height:100%;background:#000;border-left:1px solid #fff;transition:1s cubic-bezier(0.77,0,0.175,1);transform-origin:right}
.door:hover .panel{transform:perspective(1000px) rotateY(-72deg)}
.hero h1{margin-top:40px;font-size:13px;letter-spacing:0.35em;font-weight:300;opacity:0.6}
.hero p{margin-top:12px;font-size:22px;font-weight:200;letter-spacing:-0.02em}
/* CONTENT - NO ICONS, JUST TEXT */
.wrap{max-width:900px;margin:0 auto;padding:0 24px}
.line{height:1px;background:#111;margin:0}
.row{display:grid;grid-template-columns:80px 1fr 1fr;gap:20px;padding:36px 0;border-bottom:1px solid #111;align-items:start}
.row .num{font-size:10px;opacity:0.25;letter-spacing:0.2em;padding-top:4px}
.row h3{font-size:12px;letter-spacing:0.25em;font-weight:400;margin-bottom:10px}
.row p{font-size:13px;opacity:0.45;line-height:1.7;font-weight:200}
/* UPLOAD - MINIMAL */
.upload{padding:100px 24px;text-align:center;border-top:1px solid #111;border-bottom:1px solid #111;margin-top:80px}
.upload h2{font-size:11px;letter-spacing:0.4em;opacity:0.3;margin-bottom:40px}
.box{max-width:520px;margin:0 auto 32px;border:1px solid #1a1a1a;padding:48px 20px;transition:0.3s;cursor:pointer}
.box:hover{border-color:#fff}
.box .plus{font-size:20px;font-weight:200;margin-bottom:12px}
.box small{font-size:10px;opacity:0.3;letter-spacing:0.1em}
.btn{margin-top:24px;border:1px solid #fff;background:transparent;color:#fff;padding:14px 40px;font-size:10px;letter-spacing:0.3em;cursor:pointer;transition:0.3s}
.btn:hover{background:#fff;color:#000}
.foot{padding:40px;text-align:center;font-size:9px;opacity:0.18;letter-spacing:0.3em}
@media(max-width:600px){.row{grid-template-columns:1fr;gap:8px}.menu{display:none}.door{width:72vw;height:96vw}}
</style>
</head>
<body>
<div class="top"><div class="logo">VOEZ</div><div class="menu"><span>HOW IT WORKS</span><span>RECEIPT</span></div></div>

<div class="hero">
<div class="door"><div class="field"></div><div class="panel"></div></div>
<h1>ENTER THE VOID</h1>
<p>Show a receipt. Unlock rewards.</p>
</div>

<div class="line"></div>
<div class="wrap">
<div class="row"><div class="num">01</div><div><h3>BUY</h3></div><div><p>Acquire instantly.<br>Secure on-chain.</p></div></div>
<div class="row"><div class="num">02</div><div><h3>HOLD</h3></div><div><p>Cold storage.<br>You control your keys.</p></div></div>
<div class="row"><div class="num">03</div><div><h3>UNLOCK</h3></div><div><p>Receipt is the key.<br>Access anytime.</p></div></div>
</div>

<div class="upload">
<h2>PROTOCOL</h2>
<div class="box" id="drop"><div class="plus">+</div><div style="font-size:12px;letter-spacing:0.05em">Drop receipt here</div><small>.pdf .jpg .png — Max 10MB</small><input type="file" id="file" hidden></div>
<button class="btn" id="go">SCAN</button>
<div id="stat" style="margin-top:18px;font-size:10px;opacity:0.4;letter-spacing:0.1em"></div>
</div>

<div class="foot">VOEZ © 2026</div>

<script>
const d=document.getElementById('drop'),f=document.getElementById('file'),g=document.getElementById('go'),s=document.getElementById('stat');
d.onclick=()=>f.click();d.ondragover=e=>{e.preventDefault();d.style.borderColor='#fff'};d.ondragleave=()=>d.style.borderColor='#1a1a1a';
d.ondrop=e=>{e.preventDefault();handle(e.dataTransfer.files[0])};f.onchange=()=>handle(f.files[0]);
function handle(x){if(!x)return;s.textContent='✓ '+x.name;g.textContent='UNLOCK'}
g.onclick=()=>{if(!s.textContent.includes('✓')){s.textContent='Drop a receipt first';return}s.textContent='Scanning...';setTimeout(()=>s.textContent='✓ UNLOCKED',1200)}
</script>
</body>
</html>
